function exCard(e) {
  const isAlt = e.alt;
  return `<div class="exercise-card${isAlt?' alt-card':''}">
    <div class="ex-num${isAlt?' alt-num':''}">${e.n}</div>
    <div class="ex-body">
      <div class="ex-name">${isAlt?'<span style="font-size:11px;font-weight:500;background:#5DCAA5;color:#04342C;padding:1px 7px;border-radius:10px;margin-right:5px">ALT</span>':''}${e.name}</div>
      <div class="ex-note">${e.note}</div>
      <div class="ex-tags">
        <span class="ex-tag ts">${e.sets} series</span>
        <span class="ex-tag tr">${e.reps}</span>
        <span class="ex-tag ti2">${e.int}</span>
        <span class="ex-tag tt"><i class="ti ti-bulb" aria-hidden="true"></i> ${e.tech}</span>
        ${isAlt?'<span class="ex-tag talt">Alternativa disponible en gym</span>':''}
      </div>
    </div>
  </div>`;
}

function absCard(e) {
  return `<div class="abs-ex"><div class="abs-num">${e.n}</div><div class="abs-body"><div class="abs-name">${e.name}</div><div class="abs-note">${e.note}</div></div></div>`;
}

function foreCard(e) {
  return `<div class="fore-ex">
    <div class="ex-num">${e.n}</div>
    <div class="ex-body">
      <div class="ex-name">${e.name}</div>
      <div class="ex-note">${e.note}</div>
      <div class="ex-tags">
        <span class="ex-tag ts">${e.sets} series</span>
        <span class="ex-tag tr">${e.reps}</span>
        <span class="ex-tag ti2">${e.int}</span>
        <span class="ex-tag tt">${e.tech}</span>
      </div>
    </div>
  </div>`;
}

function renderDay(day) {
  if (day.rest) return `<div class="rest-box">
    <i class="ti ti-moon" style="font-size:36px;color:var(--color-text-secondary)" aria-hidden="true"></i>
    <div style="font-size:18px;font-weight:500;color:var(--color-text-primary);margin:0.75rem 0 0.5rem">Descanso activo — Domingo</div>
    <div style="font-size:14px;color:var(--color-text-secondary);line-height:1.7;max-width:400px;margin:0 auto">Recuperación total. Caminata 30–40 min zona 1–2 opcional. Movilidad o stretching. Duerme 8h. El músculo crece aquí, no durante el entrenamiento.</div>
  </div>`;

  let html = '';
  if (day.fasted) html += `<div class="cardio-notice"><i class="ti ti-sun" style="font-size:15px;flex-shrink:0" aria-hidden="true"></i><span><strong>Cardio en ayunas:</strong> ${day.fasted}</span></div>`;
  if (day.altNotice) html += `<div class="alt-notice"><i class="ti ti-replace" style="font-size:15px;flex-shrink:0" aria-hidden="true"></i><span>${day.altNotice}</span></div>`;
  html += ORDER;
  html += `<div class="warmup-box"><div class="block-title"><i class="ti ti-flame" aria-hidden="true"></i> Calentamiento</div><div class="warmup-items">${day.warmup.map(w=>`<span class="warmup-chip">${w}</span>`).join('')}</div></div>`;
  html += `<div class="info-grid">
    <div class="info-card"><div class="info-label">Duración sesión</div><div class="info-val">80–95 min + 35 min caminadora</div></div>
    <div class="info-card"><div class="info-label">Compuestos: descanso</div><div class="info-val">3–4 minutos</div></div>
    <div class="info-card"><div class="info-label">Aislamiento: descanso</div><div class="info-val">60–90 segundos</div></div>
  </div>`;
  for (const g of day.groups) {
    html += `<div class="muscle-group"><div class="muscle-label">${g.name}</div>${g.exs.map(exCard).join('')}</div>`;
  }
  html += `<hr class="div">`;
  if (day.fore) {
    html += `<div class="fore-block"><div class="fore-title"><i class="ti ti-arm" aria-hidden="true"></i> Antebrazos — al final de la sesión (días de espalda)</div>${foreExs.map(foreCard).join('')}</div>`;
  }
  html += `<div class="abs-block"><div class="abs-block-title"><i class="ti ti-body-scan" aria-hidden="true"></i> Abdomen en casa — 3 ejercicios simples</div>${day.abs.map(absCard).join('')}</div>`;
  html += HIPO;
  html += TREAD;
  return html;
}

function buildTabs() {
  const container = document.getElementById('tabs');
  const typeMap = {push:'ap',pull:'al',legs:'ag',rest:'ar'};
  days.forEach(day => {
    const t = day.rest ? 'rest' : day.type;
    const cls = typeMap[t] || 'ar';
    const btn = document.createElement('button');
    btn.className = 'tab-btn';
    btn.textContent = day.label;
    btn.dataset.id = day.id;
    btn.dataset.cls = cls;
    btn.dataset.type = t;
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.className='tab-btn');
      btn.className = `tab-btn ${btn.dataset.cls}`;
      const d = days.find(x=>x.id===day.id);
      const bc = {push:'bp',pull:'bl',legs:'bg',rest:'br'}[t]||'br';
      document.getElementById('content').innerHTML = `<div class="section-header"><span class="day-badge ${bc}">${d.type?d.type.toUpperCase():'REST'}</span><span class="section-title">${d.title}</span></div>${renderDay(d)}`;
    });
    container.appendChild(btn);
  });
  const first = container.querySelector('.tab-btn');
  first.className = `tab-btn ${first.dataset.cls}`;
  const fd = days[0];
  const fbc = {push:'bp',pull:'bl',legs:'bg',rest:'br'}[fd.type]||'br';
  document.getElementById('content').innerHTML = `<div class="section-header"><span class="day-badge ${fbc}">${fd.type.toUpperCase()}</span><span class="section-title">${fd.title}</span></div>${renderDay(fd)}`;
}
buildTabs();
</script>
